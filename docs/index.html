<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuskMoon Design Tokens</title>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      background: var(--color-surface, #fafafa);
      color: var(--color-on-surface, #1a1a1a);
      transition: background 0.3s, color 0.3s;
    }

    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    header { padding: 2rem 0; border-bottom: 1px solid var(--color-outline-variant, #ddd); margin-bottom: 2rem; }
    header h1 { font-size: 2rem; font-weight: 600; }
    header p { color: var(--color-on-surface-variant, #666); margin-top: 0.25rem; }

    /* Theme Switcher */
    .theme-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
      padding: 1rem 0;
    }
    .theme-bar label { font-weight: 500; margin-right: 0.5rem; }
    .theme-btn {
      border: 2px solid var(--color-outline);
      background: var(--color-surface-container, #f0f0f0);
      color: var(--color-on-surface, #1a1a1a);
      padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer;
      font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s;
    }
    .family-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--color-on-surface-variant, #888); font-weight: 600;
      margin-left: 0.25rem;
    }
    .family-sep { width: 1px; height: 1.5rem; background: var(--color-outline-variant, #ddd); margin: 0 0.25rem; }
    .theme-meta {
      font-size: 0.85rem; color: var(--color-on-surface-variant, #666);
      margin-top: 0.25rem;
    }
    .theme-meta a { color: var(--color-on-primary-container); text-decoration: underline; }
    .theme-meta a:hover { text-decoration: underline; }
    .theme-btn:hover { border-color: var(--color-on-primary-container); }
    .theme-btn.active {
      background: var(--color-primary, #333);
      color: var(--color-primary-content, #fff);
      border-color: var(--color-on-primary-container);
    }

    /* Section */
    section { margin-bottom: 3rem; }
    section h2 {
      font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-outline-variant, #ddd);
    }
    .section-desc {
      color: var(--color-on-surface-variant, #666);
      margin-bottom: 1.5rem; font-size: 0.9rem;
    }

    /* Color Grid */
    .color-group { margin-bottom: 2rem; }
    .color-group h3 {
      font-size: 1.1rem; font-weight: 500; margin-bottom: 0.75rem;
      text-transform: capitalize;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
    }
    .color-card {
      border-radius: 0.75rem; overflow: hidden;
      border: 1px solid var(--color-outline-variant, #ddd);
      background: var(--color-surface-container-low, #fff);
    }
    .color-swatch {
      height: 80px; width: 100%;
      transition: background-color 0.3s;
    }
    .color-info {
      padding: 0.5rem 0.75rem; font-size: 0.75rem;
    }
    .color-name {
      font-weight: 600; font-size: 0.8rem;
      margin-bottom: 0.15rem;
      word-break: break-all;
    }
    .color-value {
      color: var(--color-on-surface-variant, #888);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.7rem;
    }

    /* Typography Table */
    .type-table {
      width: 100%; border-collapse: collapse;
    }
    .type-table th, .type-table td {
      text-align: left; padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--color-outline-variant, #eee);
    }
    .type-table th {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--color-on-surface-variant, #666);
      font-weight: 600;
    }
    .type-preview { font-weight: var(--tw); }

    /* Token Pills */
    .token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .token-pill {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--color-outline-variant, #ddd);
      background: var(--color-surface-container-low, #fff);
      font-size: 0.8rem;
    }
    .token-pill .label { font-weight: 500; }
    .token-pill .value {
      color: var(--color-on-surface-variant, #888);
      font-family: monospace; font-size: 0.75rem;
    }

    /* Spacing visual */
    .spacing-bar {
      height: 1.25rem; border-radius: 0.25rem;
      background: var(--color-primary, #4a90d9);
      opacity: 0.7; transition: width 0.3s;
    }
    .spacing-row {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 0.4rem;
    }
    .spacing-row .label { width: 4rem; font-size: 0.8rem; font-weight: 500; text-align: right; }
    .spacing-row .value {
      font-size: 0.75rem; color: var(--color-on-surface-variant, #888);
      font-family: monospace; min-width: 3rem;
    }

    /* Radius preview */
    .radius-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
    }
    .radius-card {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid var(--color-primary, #4a90d9);
      background: var(--color-surface-container, #f5f5f5);
      transition: border-radius 0.3s;
    }
    .radius-label { font-weight: 500; font-size: 0.85rem; }
    .radius-value { font-size: 0.75rem; color: var(--color-on-surface-variant, #888); font-family: monospace; }

    /* Shape table */
    .shape-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .shape-card {
      padding: 1rem; border-radius: 0.75rem;
      border: 1px solid var(--color-outline-variant, #ddd);
      background: var(--color-surface-container-low, #fff);
    }
    .shape-card .label { font-weight: 600; font-size: 0.85rem; }
    .shape-card .value {
      font-family: monospace; font-size: 0.8rem;
      color: var(--color-on-surface-variant, #888);
      margin-top: 0.25rem;
    }

    /* Footer */
    footer {
      margin-top: 4rem; padding: 2rem 0;
      border-top: 1px solid var(--color-outline-variant, #ddd);
      color: var(--color-on-surface-variant, #888);
      font-size: 0.8rem; text-align: center;
    }

    /* Loading */
    #loading {
      text-align: center; padding: 4rem;
      color: var(--color-on-surface-variant, #888);
    }

    /* Role previews use generated tokens and their authored content pairings. */
    a { color: var(--color-on-primary-container); }
    :where(button, input, select, a, summary):focus-visible {
      outline: 3px solid var(--color-on-primary-container); outline-offset: 4px;
    }
    button, input, select { font: inherit; }
    .preview-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: baseline; margin: 2rem 0 1rem; }
    .preview-heading h2 { margin: 0; border: 0; padding: 0; }
    .mode-picker { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
    select, .workspace input { background: var(--color-surface-container-lowest); color: var(--color-on-surface); border: 2px solid var(--color-outline); border-radius: .5rem; padding: .5rem .75rem; }
    .workspace { display: grid; grid-template-columns: 180px minmax(0,1fr); border: 1px solid var(--color-outline-variant); border-radius: 1.25rem; overflow: visible; background: var(--color-surface-container-lowest); }
    .workspace nav { padding: 1.25rem; background: var(--color-surface-container); border-radius: 1.25rem 0 0 1.25rem; }
    .workspace nav a { display: block; padding: .6rem; margin: .25rem 0; border: 2px solid transparent; border-radius: .5rem; text-decoration: none; }
    .workspace nav a[aria-current] { background: var(--color-primary-container); border-color: var(--color-on-primary-container); font-weight: 700; }
    .workspace-main { padding: 1.5rem; min-width: 0; }
    .workspace h3 { font: 600 1.8rem/1.2 Georgia, serif; margin-bottom: .4rem; }
    .muted { color: var(--color-on-surface-variant); }
    .workspace label { display: grid; gap: .4rem; margin: 1rem 0; max-width: 28rem; }
    .workspace input { width: 100%; min-width: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1rem 0; }
    .action { border: 2px solid var(--color-on-primary-container); padding: .5rem 1rem; border-radius: .6rem; cursor: pointer; font-weight: 600; }
    .action:hover { text-decoration: underline; text-underline-offset: .2em; }
    .save { background: var(--color-primary); color: var(--color-primary-content); }
    .support { background: var(--color-secondary); color: var(--color-secondary-content); }
    .complement { background: var(--color-tertiary); color: var(--color-tertiary-content); }
    .cancel { background: var(--color-surface-container-lowest); color: var(--color-on-surface); border-color: var(--color-outline); }
    .delete { background: var(--color-error); color: var(--color-error-content); border-color: var(--color-error); }
    .status-grid, .comparison-grid, .pair-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .75rem; }
    .status-item, .role-sample { border-radius: .65rem; padding: .85rem 1rem; }
    .status-item strong { display: block; }
    .role-sample strong, .role-sample small { display: block; }
    .tonal-panel { background: var(--color-surface-container); border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
    .comparison { background: var(--color-surface-container-lowest); border: 1px solid var(--color-outline-variant); border-radius: .75rem; padding: 1rem; min-width: 0; }
    .comparison h3 { margin-bottom: .75rem; }
    .comparison .comparison-grid { margin-top: .75rem; }
    .pair-card { border: 1px solid var(--color-outline-variant); border-radius: .75rem; overflow: hidden; min-width: 0; }
    .pair-card .role-sample { border-radius: 0; overflow-wrap: anywhere; }
    .pair-result { padding: .5rem .75rem; font-size: .8rem; background: var(--color-surface-container-low); }
    .table-scroll { max-width: 100%; overflow-x: auto; }
    .color-value { overflow-wrap: anywhere; }
    .spacing-bar { flex-shrink: 1; min-width: 0; }
    .spacing-row .label, .spacing-row .value { flex-shrink: 0; }
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      header { padding: 1rem 0; margin-bottom: 1rem; }
      .workspace { grid-template-columns: minmax(0,1fr); }
      .workspace nav { border-radius: 1.25rem 1.25rem 0 0; display: flex; flex-wrap: wrap; gap: .5rem; }
      .workspace nav p { width: 100%; }
      .workspace-main { padding: 1rem; }
      .status-grid, .pair-grid, .comparison-grid { grid-template-columns: minmax(0,1fr); }
      .comparison .comparison-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .color-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .role-sample { padding: .75rem; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div id="loading">Loading design tokens…</div>
  </div>

  <!-- Inline generated data at build time (populated by build script) -->
  <script id="theme-data" type="application/json">__THEME_DATA__</script>
  <script id="shared-data" type="application/json">__SHARED_DATA__</script>
  <script id="pair-data" type="application/json">__PAIR_DATA__</script>

  <script>
    // ── Data ──
    let themes, shared;
    try {
      themes = JSON.parse(document.getElementById('theme-data').textContent);
      shared = JSON.parse(document.getElementById('shared-data').textContent);
    } catch {
      document.getElementById('loading').textContent = 'Failed to load token data.';
      throw new Error('Token data not embedded');
    }

    const themeNames = Object.keys(themes);
    let activeTheme = themes.sunshine ? 'sunshine' : themeNames[0];
    let previewMode = 'native';
    const pairData = JSON.parse(document.getElementById('pair-data').textContent);

    // Group themes by family using metadata
    const families = {};
    for (const name of themeNames) {
      const meta = themes[name].meta;
      if (meta && meta.family) {
        if (!families[meta.family]) families[meta.family] = [];
        families[meta.family].push(name);
      }
    }

    // ── Color grouping ──
    const COLOR_GROUPS = [
      { name: 'Primary',   keys: ['primary', 'primary-content', 'primary-container', 'on-primary-container'] },
      { name: 'Secondary', keys: ['secondary', 'secondary-content', 'secondary-container', 'on-secondary-container'] },
      { name: 'Tertiary',  keys: ['tertiary', 'tertiary-content', 'tertiary-container', 'on-tertiary-container'] },
      { name: 'Accent',    keys: ['accent', 'accent-content'] },
      { name: 'Neutral',   keys: ['neutral', 'neutral-content', 'neutral-variant'] },
      { name: 'Surface',   keys: ['surface', 'surface-dim', 'surface-bright', 'surface-container-lowest', 'surface-container-low', 'surface-container', 'surface-container-high', 'surface-container-highest', 'surface-variant', 'on-surface', 'on-surface-variant'] },
      { name: 'Base',      keys: ['base-100','base-200','base-300','base-400','base-500','base-600','base-700','base-800','base-900','base-content'] },
      { name: 'Outline',   keys: ['outline', 'outline-variant'] },
      { name: 'Inverse',   keys: ['inverse-surface', 'inverse-on-surface', 'inverse-primary'] },
      { name: 'Shadow',    keys: ['shadow', 'scrim'] },
      { name: 'Semantic',  keys: ['info','info-content','info-container','on-info-container','success','success-content','success-container','on-success-container','warning','warning-content','warning-container','on-warning-container','error','error-content','error-container','on-error-container'] },
    ];

    // ── Helpers ──
    const h = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

    function oklchStr(c) {
      let s = `${c.l*100}% ${c.c} ${c.h}`;
      if (c.alpha != null) s += ` / ${c.alpha*100}%`;
      return s;
    }

    function previewColor(c) {
      if (previewMode === 'native') return `oklch(${oklchStr(c)})`;
      if (c.alpha == null) return c.hex;
      const rgb = [1,3,5].map(i => parseInt(c.hex.slice(i,i+2),16));
      return `rgb(${rgb.join(' ')} / ${c.alpha})`;
    }

    function pairStyle(colors, bg, fg) {
      return `background:${previewColor(colors[bg])};color:${previewColor(colors[fg])}`;
    }

    function changePreviewMode(value) {
      previewMode = value;
      render();
      document.getElementById('preview-mode').focus();
    }

    function renderWorkspace(colors) {
      const statuses = [['info','ⓘ','Information','Your workspace is up to date.'], ['success','✓','Success','Changes have been saved.'], ['warning','⚠','Warning','Review before replacing this file.'], ['error','!','Error','This file could not be uploaded.']];
      return `<section id="role-preview">
        <div class="preview-heading"><h2>A workspace in the light</h2>
          <label class="mode-picker">Color output <select id="preview-mode" onchange="changePreviewMode(this.value)">
            <option value="native" ${previewMode === 'native' ? 'selected' : ''}>Native OKLCH</option>
            <option value="srgb" ${previewMode === 'srgb' ? 'selected' : ''}>Generated sRGB</option>
          </select></label>
        </div>
        <p class="section-desc">Brand fills support the work. Neutral surfaces give it room. Try Tab to see real keyboard focus.</p>
        <div class="workspace">
          <nav aria-label="Workspace preview"><p class="muted">YOUR WORKSPACE</p>
            <a href="#workspace-title" aria-current="page">✓ Overview</a><a href="#role-comparisons">Role guide</a><a href="#pair-results">Contrast pairs</a>
          </nav>
          <div class="workspace-main">
            <h3 id="workspace-title">A little room to think.</h3><p class="muted">White cards, warm canvas, and quieter supporting colors.</p>
            <label>Workspace name<input value="Morning notes" aria-describedby="preview-help"></label>
            <p id="preview-help" class="muted">An editable preview. Actions below demonstrate visual roles.</p>
            <div class="actions"><button class="action save" onclick="previewAction('Saved this preview.')">Save</button><button class="action cancel" onclick="previewAction('Cancelled this preview.')">Cancel</button><button class="action delete" onclick="previewAction('Delete is destructive. This preview deletes no data.')">⌫ Delete</button></div>
            <div class="tonal-panel"><strong>Supporting expression</strong><p>Supporting brand roles do not determine action priority.</p><div class="actions"><button class="action support" onclick="previewAction('Supporting collection selected.')">◇ Collection</button><button class="action complement" onclick="previewAction('Complementary view selected.')">↗ Explore</button></div><a href="#pair-results">Inspect the actual content pairings</a></div>
            <div class="status-grid">${statuses.map(([role,icon,label,copy]) => `<div class="status-item" style="${pairStyle(colors,role+'-container','on-'+role+'-container')}"><strong><span aria-hidden="true">${icon}</span> ${label}</strong>${copy}</div>`).join('')}</div>
            <p id="action-feedback" role="status" class="muted">Preview ready.</p>
          </div>
        </div>
      </section>`;
    }

    function previewAction(message) { document.getElementById('action-feedback').textContent = message; }

    function renderComparisons() {
      const colors = themes[activeTheme].colors;
      const sample = (c, role, label) => `<div class="role-sample" style="${pairStyle(c,role,role+'-content')}"><strong>${label}</strong><small>${role}</small></div>`;
      const paired = themes[themes[activeTheme].meta.pair];
      return `<section id="role-comparisons"><h2>Different roles. Explicit meaning.</h2><p class="section-desc">Labels and symbols carry meaning beyond hue, including under color-vision differences.</p>
        <div class="comparison-grid">
          <div class="comparison"><h3>Supporting / destructive</h3><div class="comparison-grid">${sample(colors,'secondary','◇ Collection')}${sample(colors,'error','⌫ Delete')}</div></div>
          <div class="comparison"><h3>Primary / warning</h3><div class="comparison-grid">${sample(colors,'primary','✓ Save')}${sample(colors,'warning','⚠ Review risk')}</div></div>
        </div>
        <details style="margin-top:1rem"><summary>Compare paired themes: ${activeTheme} / ${paired.meta.name}</summary><p class="muted">The semantic roles stay consistent; hues need not match. Moonlight is unchanged and still needs its own contrast and gamut review.</p>
          <div class="comparison-grid">${[themes[activeTheme],paired].map(theme => `<div class="comparison" style="${pairStyle(theme.colors,'surface','on-surface')}"><h3>${theme.meta.name}</h3><div class="comparison-grid">${sample(theme.colors,'primary','Primary')}${sample(theme.colors,'secondary','Supporting')}${sample(theme.colors,'tertiary','Complementary')}${sample(theme.colors,'error','Destructive')}</div></div>`).join('')}</div>
        </details>
      </section>`;
    }

    function renderPairs() {
      const colors = themes[activeTheme].colors;
      return `<section id="pair-results"><h2>Filled &amp; container pairs</h2><p class="section-desc">Actual authored foregrounds. Normal text requires ≥ 4.5:1; ratios below are rounded only for display. A readable label alone does not prove a visible control boundary. Ratios use sRGB; out-of-gamut themes need separate display review.</p><div class="pair-grid">${pairData[activeTheme].map(pair => `<div class="pair-card"><div class="role-sample" style="${pairStyle(colors,pair.background,pair.foreground)}"><strong>${pair.background}</strong><small>${pair.foreground}</small></div><div class="pair-result">OKLCH ${pair.native.toFixed(2)}:1 ${pair.native >= 4.5 ? 'PASS' : 'FAIL'} · sRGB ${pair.srgb.toFixed(2)}:1 ${pair.srgb >= 4.5 ? 'PASS' : 'FAIL'}</div></div>`).join('')}</div></section>`;
    }

    // ── Render ──
    function render() {
      const data = themes[activeTheme];
      const meta = data.meta || {};
      const colors = data.colors;
      const shape = data.shape;
      const { typeScale, spacing, radius, elevation } = shared;

      const familyNames = Object.keys(families);
      const themeSwitcher = familyNames.length > 0
        ? familyNames.map(fam => `
            <span class="family-label">${h(fam)}</span>
            ${families[fam].map(t => `<button class="theme-btn ${t === activeTheme ? 'active' : ''}" data-theme-choice="${t}" aria-pressed="${t === activeTheme}" onclick="switchTheme('${t}')">${t}</button>`).join('')}
          `).join('<span class="family-sep"></span>')
        : themeNames.map(t => `<button class="theme-btn ${t === activeTheme ? 'active' : ''}" data-theme-choice="${t}" aria-pressed="${t === activeTheme}" onclick="switchTheme('${t}')">${t}</button>`).join('');

      document.getElementById('app').innerHTML = `
        <header>
          <h1>DuskMoon Design Tokens</h1>
          <p>OKLCH color system &middot; ${themeNames.length} themes in ${familyNames.length} families &middot; Material Design 3 type scale</p>
        </header>

        <div class="theme-bar">
          <label>Theme:</label>
          ${themeSwitcher}
        </div>
        ${meta.description ? `<p class="theme-meta">${h(meta.description)} &middot; ${h(meta.mode)} mode &middot; pair: <a href="#" onclick="event.preventDefault();switchTheme('${meta.pair}')">${h(meta.pair)}</a></p>` : ''}

        ${renderWorkspace(colors)}
        ${renderComparisons()}
        ${renderPairs()}

        <!-- Colors -->
        <section>
          <h2>Colors</h2>
          <p class="section-desc">${Object.keys(colors).length} color tokens in OKLCH color space</p>
          ${COLOR_GROUPS.map(g => `
            <div class="color-group">
              <h3>${h(g.name)}</h3>
              <div class="color-grid">
                ${g.keys.filter(k => colors[k]).map(k => {
                  const c = colors[k];
                  return `<div class="color-card">
                    <div class="color-swatch" style="background-color:${previewColor(c)}"></div>
                    <div class="color-info">
                      <div class="color-name">${h(k)}</div>
                      <div class="color-value">${h(c.hex)}</div>
                      <div class="color-value">oklch(${h(oklchStr(c))})</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </section>

        <!-- Shape -->
        <section>
          <h2>Shape</h2>
          <p class="section-desc">Per-theme shape tokens defining border radius, size, and visual depth</p>
          <div class="shape-grid">
            ${Object.entries(shape).map(([k, v]) => `
              <div class="shape-card">
                <div class="label">${h(k)}</div>
                <div class="value">${h(String(v))}</div>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- Typography -->
        <section>
          <h2>Typography</h2>
          <p class="section-desc">Material Design 3 type scale — 15 styles across 5 categories</p>
          <div class="table-scroll"><table class="type-table">
            <thead><tr><th>Style</th><th>Size</th><th>Weight</th><th>Line Height</th><th>Letter Spacing</th><th>Preview</th></tr></thead>
            <tbody>
              ${Object.entries(typeScale).map(([k, t]) => `
                <tr>
                  <td style="font-weight:500">${h(k)}</td>
                  <td>${t.size}px</td>
                  <td>${t.weight}</td>
                  <td>${t.lineHeight}px</td>
                  <td>${t.letterSpacing}px</td>
                  <td><span class="type-preview" style="font-size:${Math.min(t.size, 32)}px;font-weight:${t.weight};line-height:${t.lineHeight}px;letter-spacing:${t.letterSpacing}px">Aa</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table></div>
        </section>

        <!-- Spacing -->
        <section>
          <h2>Spacing</h2>
          <p class="section-desc">14-step spacing scale (px values)</p>
          ${Object.entries(spacing).map(([k, v]) => `
            <div class="spacing-row">
              <span class="label">sp-${h(k)}</span>
              <div class="spacing-bar" style="width:${Math.max(v, 2)}px"></div>
              <span class="value">${v}px</span>
            </div>
          `).join('')}
        </section>

        <!-- Radius -->
        <section>
          <h2>Radius</h2>
          <p class="section-desc">8 border-radius tokens</p>
          <div class="radius-grid">
            ${Object.entries(radius).map(([k, v]) => `
              <div class="radius-card" style="border-radius:${Math.min(v, 40)}px">
                <span class="radius-label">${h(k)}</span>
                <span class="radius-value">${v}px</span>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- Elevation -->
        <section>
          <h2>Elevation</h2>
          <p class="section-desc">6 elevation levels (shadow offset in px)</p>
          <div class="token-grid">
            ${Object.entries(elevation).map(([k, v]) => `
              <div class="token-pill" style="box-shadow: 0 ${v}px ${v*2}px rgba(0,0,0,0.15)">
                <span class="label">${h(k)}</span>
                <span class="value">${v}px</span>
              </div>
            `).join('')}
          </div>
        </section>

        <footer>
          DuskMoon Design Tokens v1.0.0 &middot; Generated by duskmoon-codegen v2.0.0
        </footer>
      `;

      // Apply generated data in the selected color representation
      applyThemeCSS();
    }

    function applyThemeCSS() {
      // Apply colors from JSON data directly as CSS custom properties
      const data = themes[activeTheme];
      const root = document.documentElement;
      root.style.colorScheme = data.meta.mode;
      for (const [k, c] of Object.entries(data.colors)) {
        root.style.setProperty(`--color-${k}`, previewColor(c));
      }
      for (const [k, v] of Object.entries(data.shape)) {
        if (k.startsWith('radius') || k.startsWith('size') || k === 'border') {
          root.style.setProperty(`--${k}`, String(v));
        }
      }
    }

    function switchTheme(name) {
      activeTheme = name;
      render();
      document.querySelector(`[data-theme-choice="${name}"]`)?.focus();
    }

    // ── Init ──
    render();
  </script>
</body>
</html>
