name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout design repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate token files
        run: bun run validate

      - name: Run unit tests
        run: bun test

  staleness:
    name: Staleness Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout design repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate all targets
        run: bun run generate

      - name: Staleness check — generated/
        run: |
          if ! git diff --exit-code generated/; then
            echo "ERROR: generated/ files are stale. Run 'bun run generate' and commit."
            exit 1
          fi
